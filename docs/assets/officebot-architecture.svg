<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Officebot conceptual architecture</title>
  <desc id="desc">Synthetic mock events flow to context and evidence, then goals and a durable scheduler, then human approval, then a mock effect. A local dashboard and optional Discord are interfaces.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#607a89"/></marker></defs>
  <rect width="1200" height="380" rx="24" fill="#eef5f4"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" text-anchor="middle">
    <text x="600" y="47" fill="#456478" font-size="19" font-weight="700" letter-spacing="1">CONCEPTUAL FLOW · SYNTHETIC OFFICE DATA</text>
    <g fill="#fff" stroke="#cbded9" stroke-width="2">
      <rect x="24" y="100" width="188" height="110" rx="18"/>
      <rect x="258" y="100" width="188" height="110" rx="18"/>
      <rect x="492" y="100" width="216" height="110" rx="18"/>
      <rect x="754" y="100" width="188" height="110" rx="18"/>
      <rect x="988" y="100" width="188" height="110" rx="18"/>
      <rect x="397" y="265" width="406" height="78" rx="18" fill="#d8efe8"/>
    </g>
    <g stroke="#607a89" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M215 155h37"/><path d="M449 155h37"/><path d="M711 155h37"/><path d="M945 155h37"/>
    </g>
    <path d="M600 265v-43" stroke="#607a89" stroke-width="3" stroke-dasharray="6 6"/>
    <g fill="#203c4e" font-size="22" font-weight="700">
      <text x="118" y="146">Mock</text><text x="118" y="176">events</text>
      <text x="352" y="146">Context +</text><text x="352" y="176">evidence</text>
      <text x="600" y="139">Goals + durable</text><text x="600" y="169">scheduler</text>
      <text x="848" y="146">Human</text><text x="848" y="176">approval</text>
      <text x="1082" y="146">Mock</text><text x="1082" y="176">effect</text>
      <text x="600" y="299">Local dashboard</text><text x="600" y="328" font-size="19" font-weight="500">+ optional Discord interface</text>
    </g>
  </g>
</svg>
