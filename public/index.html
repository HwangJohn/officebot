<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f6feb'/%3E%3Cpath d='M16 20h32v6H16zm0 12h22v6H16zm0 12h30v6H16z' fill='white'/%3E%3C/svg%3E"><title>Officebot</title><style>
body{margin:0;font-family:system-ui,Segoe UI,Apple SD Gothic Neo,sans-serif;background:#f6f7fb;color:#182033}.wrap{max-width:1180px;margin:auto;padding:22px}header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;background:#e8f1ff;color:#124e9b;font-weight:700}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.card{background:white;border:1px solid #dde3ef;border-radius:14px;padding:16px;box-shadow:0 1px 2px #0001;margin:12px 0}button{border:0;border-radius:10px;padding:9px 12px;margin:4px;background:#1f6feb;color:white;cursor:pointer}button.secondary{background:#6b7280}button.danger{background:#b42318}button:disabled{opacity:.55;cursor:wait}.muted{color:#667085}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f7;margin:2px}.pill.warn{background:#fff4cc;color:#7a4b00}.pill.ok{background:#ddf8e8;color:#05603a}pre{white-space:pre-wrap;background:#0b1020;color:#d8e2ff;padding:12px;border-radius:10px;max-height:260px;overflow:auto}.approval{border-left:5px solid #f59e0b}.executed{border-left-color:#16a34a}.stale,.expired,.rejected{border-left-color:#64748b}.row{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;min-height:70px;box-sizing:border-box}.analysis-box{border-top:1px solid #e5eaf3;margin-top:12px;padding-top:12px}.analysis-list{padding-left:18px}.err{color:#b42318;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}header{align-items:flex-start}.badge{max-width:100%}}
</style></head><body><div class="wrap"><header><div><h1>Officebot</h1><div class="muted">합성 Outlook · Teams · Jira · Confluence / 실제 업무 서비스 호출 없음</div></div><div id="mode" class="badge">로딩</div></header><div class="card"><div class="row"><button onclick="act('/api/ingest-all')">합성 이벤트 모두 수집</button><button onclick="act('/api/step')">목표 한 단계 진행</button><button onclick="act('/api/clock/advance',{kind:'day'})">하루 진행/브리핑</button><button onclick="act('/api/clock/advance',{kind:'week'})">주간 운영 점검</button></div><div id="fixtures" class="row"></div><span id="error" class="err"></span></div><div class="grid"><section><div class="card"><h2>목표/할 일 진행</h2><div id="goal"></div></div><div class="card"><h2>분석과 초안 제안</h2><textarea id="analysisGoal" maxlength="1000" placeholder="예: 목요일 기한과 견적 대기 상태를 반영해서 제안서 회신 초안을 검토해줘"></textarea><div class="row"><button id="analysisButton" onclick="analyze()">분석/초안 제안</button><span id="analysisStatus" class="pill">저장된 분석 없음</span></div><div class="muted">제안은 실행, 발송, 승인 카드 생성, 목표 상태 변경을 하지 않습니다.</div><div id="analysisResult" class="analysis-box"></div></div><div class="card"><h2>이벤트 인박스</h2><div id="events"></div></div><div class="card"><h2>근거와 초안</h2><div id="evidence"></div><pre id="draft">초안 없음</pre></div></section><section><div class="card"><h2>승인 카드</h2><div id="approvals"></div></div><div class="card"><h2>실행 이력</h2><div id="outcomes"></div></div><div class="card"><h2>브리핑/운영 점검</h2><div id="digests"></div></section></div></div><script>
let busy=false; const $=id=>document.getElementById(id); async function api(url,opt={}){const method=opt.method||'GET', init={method,headers:{}}; if(method!=='GET'){init.headers['content-type']='application/json'; init.body=JSON.stringify(opt.body===undefined?{}:opt.body)} const r=await fetch(url,init); if(!r.ok) throw new Error((await r.json()).error||r.statusText); return r.json()} async function act(url,body){if(busy)return; busy=true; const originals=[...document.querySelectorAll('button')]; const prev=originals.map(b=>b.disabled); originals.forEach(b=>b.disabled=true); $('error').textContent=''; try{await api(url,{method:'POST',body}); await load()}catch(e){$('error').textContent=e.message}finally{busy=false; originals.forEach((b,i)=>{b.disabled=prev[i]})}}
async function decide(id,decision,body){await act('/api/approvals/'+encodeURIComponent(id)+'/decide',{decision,edit:body?{body}:undefined})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s).replace(/`/g,'&#96;')}
async function analyze(){if(busy)return; const goal=$('analysisGoal').value; busy=true; $('analysisButton').disabled=true; $('analysisStatus').textContent='분석 중'; $('analysisResult').textContent=''; $('error').textContent=''; try{const r=await api('/api/analyze',{method:'POST',body:{goalText:goal}}); renderAnalysis(r); await load({preserveAnalysis:true})}catch(e){$('analysisStatus').textContent='오류'; $('error').textContent=e.message}finally{busy=false; $('analysisButton').disabled=false}}
function cite(ids){return ids&&ids.length?` <span class="muted">근거: ${esc(ids.join(', '))}</span>`:''}
function sourceList(a){let o=a.output||{}, ids=[...(o.summaryEvidenceIds||[]),...(o.observations||[]).flatMap(x=>x.evidenceIds||[]),...(o.suggestedNextSteps||[]).flatMap(x=>x.evidenceIds||[]),...(o.draftProposal?.evidenceIds||[])], cited=new Set(ids); let sources=(a.evidenceSources||[]).filter(s=>cited.has(s.id)); if(!sources.length)return ''; return `<h3>인용 출처</h3><ul class="analysis-list">${sources.map(s=>`<li><b>${esc(s.id)}</b> ${esc(s.source)} · ${esc(s.sourceEventId)} · ${esc(s.title)}<br><span class="muted">${esc(s.excerpt)}</span></li>`).join('')}</ul>`}
function renderAnalysis(a){if(!a){$('analysisStatus').textContent='저장된 분석 없음'; $('analysisResult').textContent=''; return} const o=a.output||{}; let label=a.source==='cached'?'캐시됨':(a.source==='live'?'라이브 저장됨':(a.source==='offline'?'오프라인 목업 저장됨':'저장됨')); if(a.stale)label+=' · 오래됨'; $('analysisStatus').textContent=label; $('analysisStatus').className='pill '+(a.stale?'warn':'ok'); $('analysisResult').innerHTML=`<p><b>표시 목표</b> ${esc(a.normalizedGoal||'')}</p><p><b>${esc(o.status||'')}</b> ${esc(o.koreanSummary||'')}${cite(o.summaryEvidenceIds)}</p><h3>관찰</h3><ul class="analysis-list">${(o.observations||[]).map(x=>`<li>${esc(x.text)}${cite(x.evidenceIds)}</li>`).join('')||'<li class="muted">없음</li>'}</ul><h3>제안 다음 단계</h3><ul class="analysis-list">${(o.suggestedNextSteps||[]).map(x=>`<li>${esc(x.text)}${cite(x.evidenceIds)}</li>`).join('')||'<li class="muted">없음</li>'}</ul><h3>부족한 정보</h3><ul class="analysis-list">${(o.missingInformation||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li class="muted">없음</li>'}</ul><h3>${esc(o.draftProposal?.title||'초안 없음')}</h3><pre>${esc(o.draftProposal?.body||'')}</pre>${cite(o.draftProposal?.evidenceIds)}${sourceList(a)}`}
function fixtureButtons(){let names=['요청','견적대기','정책','Jira','기한정정','견적도착','타프로젝트','중복','악성']; $('fixtures').innerHTML=names.map((n,i)=>`<button class="secondary" onclick="act('/api/fixtures/${i}')">${i+1}. ${n}</button>`).join('')}
async function load(opts={}){fixtureButtons(); const s=await api('/api/state'); $('mode').textContent=(s.liveSdk?'OpenAI 모드 · 실제 Agents SDK HITL':'오프라인 모드 · 결정론 엔진')+' · '+s.now; if(!opts.preserveAnalysis&&s.latestAnalysis)renderAnalysis(s.latestAnalysis); $('goal').innerHTML=`<p><b>상태</b> ${esc(s.goal.status)} <span class="pill">버전 ${s.goal.task_version}</span> <span class="pill">중복재생 ${s.duplicateCount}</span></p><p><b>기한</b> ${esc(s.goal.due_date||'미정')} / <b>견적</b> ${esc(s.goal.quote||'대기')}</p><p><b>다음 행동</b> ${esc(s.goal.next_step)}</p><p><b>대기 조건</b> ${esc(s.goal.wait_condition||'없음')}</p><h3>개인 로컬 할 일</h3>`+s.todos.map(t=>`<div class="pill">${esc(t.title)} · ${esc(t.due_date)} · ${esc(t.status)}</div>`).join(''); $('events').innerHTML=s.events.map(e=>`<div><span class="pill">${esc(e.source)}</span> ${esc(e.source_event_id)} · ${esc(e.title)}</div>`).join('')||'수집 전'; $('evidence').innerHTML=s.evidence.map(e=>`<p><b>${esc(e.id)}</b> ${esc(e.source)} · ${esc(e.sourceEventId)} · ${esc(e.title)} ${e.trusted?'<span class="pill">신뢰 근거</span>':'<span class="pill">불신/명령 무시</span>'}<br><span class="muted">${esc(e.excerpt)}</span></p>`).join(''); $('draft').textContent=s.latestDraft?.content||'초안 없음'; $('approvals').innerHTML=s.approvals.map(a=>{let p=a.payload||{}, can=a.status==='pending'||a.status==='deferred'; let editText=a.action_type==='send_message'?(p.body||''):(p.comment||''); return `<div class="card approval ${a.status}"><b>${esc(a.id)}</b> <span class="pill">${esc(a.status)}</span><p>대상: ${esc(a.target)} / 업무버전 ${a.task_version} / 만료 ${esc(a.expires_at)}</p><pre>${esc(JSON.stringify(p,null,2))}</pre><textarea id="edit-${attr(a.id)}">${esc(editText)}</textarea><div class="row"><button ${can?'':'disabled'} onclick="decide('${attr(a.id)}','approve')">승인</button><button ${can?'':'disabled'} class="danger" onclick="decide('${attr(a.id)}','reject')">거절</button><button ${can?'':'disabled'} class="secondary" onclick="decide('${attr(a.id)}','defer')">나중에</button><button ${can?'':'disabled'} class="secondary" onclick="decide('${attr(a.id)}','expire')">만료 처리</button><button ${can?'':'disabled'} class="secondary" onclick="decide('${attr(a.id)}','edit',document.getElementById('edit-${attr(a.id)}').value)">수정 후 재승인 카드</button></div></div>`}).join('')||'승인 대기 없음'; $('outcomes').innerHTML=s.outcomes.map(o=>`<p><b>${esc(o.action_id)}</b> ${esc(o.status)}<br><span class="muted">${esc(o.created_at)}</span></p>`).join('')||'실행 없음'; $('digests').innerHTML=s.digests.map(d=>`<p><b>${esc(d.kind)}</b> ${esc(d.content)}</p>`).join('')||'브리핑 없음'} load();
</script></body></html>
